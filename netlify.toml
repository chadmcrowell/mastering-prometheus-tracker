[functions]
  directory = "netlify/functions"

# /leaderboard is a view inside index.html, not a separate page.
[[redirects]]
  from = "/leaderboard"
  to = "/index.html"
  status = 200

# /profile/edit and /profile/:username are views inside index.html too.
[[redirects]]
  from = "/profile/*"
  to = "/index.html"
  status = 200
